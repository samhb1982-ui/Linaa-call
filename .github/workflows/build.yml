name: Build Linaa APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Linaa project
        run: |
          mkdir linaa
          unzip -q linaa-android-v2-ci.zip -d linaa
          cp gradle.properties linaa/gradle.properties

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure JVM targets
        working-directory: linaa
        run: |
          printf '\nandroid.useAndroidX=true\nandroid.enableJetifier=true\n' >> gradle.properties
          printf '\norg.gradle.java.home=%s\n' "$JAVA_HOME" >> gradle.properties

      - name: Build Linaa
        working-directory: linaa
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Linaa APK
        uses: actions/upload-artifact@v4
        with:
          name: Linaa-APK
          path: linaa/app/build/outputs/apk/debug/app-debug.apk
