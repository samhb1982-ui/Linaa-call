name: Build Linaa APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Linaa project
        run: |
          mkdir linaa
          unzip -q linaa-android-v2-ci.zip -d linaa

          if [ ! -f "linaa/app/build.gradle.kts" ]; then
            echo "ERROR: Android project not found"
            find linaa -type f | sort
            exit 1
          fi

          echo "Android project found successfully."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android project
        run: |
          cp gradle.properties linaa/gradle.properties

          cat >> linaa/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.jvm.target.validation.mode=warning
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("linaa/app/build.gradle.kts")
          text = p.read_text()

          # Force Java compilation to target Java 17.
          text = re.sub(
              r'sourceCompatibility\s*=\s*JavaVersion\.VERSION_1_8',
              'sourceCompatibility = JavaVersion.VERSION_17',
              text
          )

          text = re.sub(
              r'targetCompatibility\s*=\s*JavaVersion\.VERSION_1_8',
              'targetCompatibility = JavaVersion.VERSION_17',
              text
          )

          # If compileOptions does not exist, add it inside the android block.
          if "compileOptions" not in text:
              match = re.search(r'android\s*\{', text)

              if match:
                  pos = match.end()
                  block = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """
                  text = text[:pos] + block + text[pos:]
              else:
                  text += """

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          """

          # Force Kotlin JVM target to 17 if the project explicitly uses 1.8.
          text = text.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          p.write_text(text)

          print("Android project configured for Java/Kotlin 17.")
          PY

      - name: Build Linaa
        working-directory: linaa
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Upload Linaa APK
        uses: actions/upload-artifact@v4
        with:
          name: Linaa-APK
          path: linaa/app/build/outputs/apk/debug/app-debug.apk
