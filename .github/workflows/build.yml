name: Build Linaa APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Linaa project
        run: |
          mkdir linaa
          unzip -q linaa-android-v2-ci.zip -d linaa

          BUILD_FILE=$(find linaa -type f -path '*/app/build.gradle' -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: Could not find app/build.gradle"
            echo ""
            echo "Files inside the ZIP:"
            find linaa -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$BUILD_FILE")")

          echo "Found Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android project
        run: |
          cp gradle.properties "$PROJECT_DIR/gradle.properties"

          cat >> "$PROJECT_DIR/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.jvm.target.validation.mode=warning
          EOF

          python3 - <<PY
          from pathlib import Path

          p = Path("$PROJECT_DIR/app/build.gradle")
          text = p.read_text()

          text = text.replace(
              "sourceCompatibility JavaVersion.VERSION_1_8",
              "sourceCompatibility JavaVersion.VERSION_17"
          )

          text = text.replace(
              "targetCompatibility JavaVersion.VERSION_1_8",
              "targetCompatibility JavaVersion.VERSION_17"
          )

          p.write_text(text)

          print("Android project configured successfully.")
          PY

      - name: Build Linaa
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace

      - name: Upload Linaa APK
        uses: actions/upload-artifact@v4
        with:
          name: Linaa-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
